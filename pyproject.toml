[project]
name = "prompt-cache-meter"
version = "0.1.0"
description = "Simulate OpenAI prompt caching costs for real conversation patterns."
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13",
    "openai>=3.19",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13",
    "starlette>=1.7.0",
    "tiktoken>=0.14.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
prompt-cache-meter = "prompt_cache_meter.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_cache_meter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls a real model provider (run with: pytest --integration)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
